name: Deploy human-readable research site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test fail-closed publication transaction
        run: node scripts/test-publication-transaction.js
      - name: Validate governed research contributions
        run: node scripts/validate-contributions.js
      - name: Test public payload safety validator
        run: node scripts/test-public-safety.js
      - name: Validate public payload safety
        run: node scripts/validate-public-safety.js
      - name: Test living evidence validator fail-closed cases
        run: node scripts/test-evidence-events.js
      - name: Validate living evidence history
        run: node scripts/validate-evidence-events.js
      - name: Test lifecycle binding validator fail-closed cases
        run: node scripts/test-lifecycle-bindings.js
      - name: Validate lifecycle and supersession bindings
        run: node scripts/validate-lifecycle-bindings.js
      - name: Check living research activity
        run: node scripts/render-research-activity.js --check
      - name: Validate canonical search contract
        run: node scripts/validate-search.js
      - name: Validate evidence relationship consistency
        run: node scripts/validate-evidence-relationship-consistency.js
      - name: Validate canonical hypothesis schema
        run: node scripts/validate-schema.js
      - name: Check generated public projections
        run: node scripts/render-public-research.js --check
      - name: Test public interface validator fail-closed cases
        run: node scripts/test-public-interface.js
      - name: Validate public HTML accessibility and local links
        run: node scripts/validate-public-interface.js
      - name: Check structured research metadata
        run: node scripts/render-structured-metadata.js --check
      - name: Check contract manifest entry point
        run: node scripts/render-machine-manifest.js --check
      - name: Validate public research boundary
        run: node scripts/validate-public-research.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
