<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OS-TH-0001 | Research hypothesis</title><style>:root{--text:#172033;--muted:#42526e;--surface:#f7f5ff;--border:#c9c3e6;--gold:#dea93f}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);line-height:1.7}main{width:min(100% - 2rem,70rem);margin:auto;padding:3rem 0}header{padding:2.5rem;border-radius:1rem;background:linear-gradient(135deg,#fff,#f7f5ff,#fff7e8,#edf8ff);border:1px solid var(--border)}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1}.pill{display:inline-block;padding:.25rem .65rem;border:1px solid var(--border);border-radius:999px;background:var(--surface);font-weight:700;margin:.15rem}.warning{border-left:6px solid var(--gold);background:#fff9ec;padding:1.2rem;margin:2rem 0;border-radius:.6rem}section{border-top:1px solid var(--border);margin-top:2rem;padding-top:.5rem}li{margin:.65rem 0}a{color:#2349a6}.error{padding:1rem;background:#fff0f0}</style></head><body><main id="app"><p>Loading canonical research object…</p></main><script>
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=a=>(a||[]).map(x=>`<li>${e(x)}</li>`).join('');
fetch('hypothesis.json').then(r=>{if(!r.ok)throw Error('Canonical object could not be loaded');return r.json()}).then(h=>{
const evidence=(h.supporting_evidence||[]).map(x=>`<li><a href="${e(x.source_url)}">${e(x.citation)}</a><br>${e(x.finding)}</li>`).join('');
const validation=(h.validation_requirements||[]).map(x=>`<li><strong>${e(x.stage)}</strong> — ${e(x.requirement)} <span class="pill">${e(x.status)}</span></li>`).join('');
const score=h.ranking.score===null?'Pending recalculation':`${e(h.ranking.score)}/100`;
document.title=`${e(h.hypothesis_id)} | ${e(h.title)}`;
document.getElementById('app').innerHTML=`<header><p><strong>${e(h.hypothesis_id)}</strong></p><h1>${e(h.title)}</h1><p>${e(h.plain_language_summary)}</p><span class="pill">${e(h.evidence_stage)}</span><span class="pill">${e(h.review_state.publication_class)}</span><span class="pill">clinical use: false</span></header><div class="warning"><strong>Research only.</strong> This is a testable research hypothesis, not an established treatment, medical advice, dose instruction or clinical recommendation.</div><section><h2>Hypothesis</h2><p>${e(h.hypothesis_statement)}</p></section><section><h2>Why this hypothesis exists</h2><p>${e(h.mechanism.summary)}</p></section><section><h2>Supporting evidence</h2><ul>${evidence}</ul></section><section><h2>Contradictory evidence</h2><p>${e(h.contradictory_evidence.assessment)}</p></section><section><h2>Uncertainty</h2><p><strong>Level: ${e(h.uncertainty.level)}</strong></p><p>${e(h.uncertainty.summary)}</p><h3>Open questions</h3><ul>${list(h.uncertainty.open_questions)}</ul></section><section><h2>Research-priority ranking</h2><p><strong>${score}</strong></p><p>${e(h.ranking.meaning)}</p></section><section><h2>Novelty</h2><p>${e(h.novelty.assessment)}</p></section><section><h2>What would challenge or falsify it?</h2><ul>${list(h.falsifiability.falsification_conditions)}</ul><h3>Discriminating tests</h3><ul>${list(h.falsifiability.discriminating_tests)}</ul></section><section><h2>Validation still required</h2><ul>${validation}</ul></section><section><h2>Review and provenance</h2><p>Review state: <strong>${e(h.review_state.status)}</strong>. Scientific review required: <strong>${e(h.review_state.scientific_review_required)}</strong>.</p><p>Source authority: ${e(h.provenance.source_authority)}</p><p><a href="hypothesis.json">Canonical JSON</a> · <a href="../../">Research portfolio</a></p></section>`;
}).catch(err=>document.getElementById('app').innerHTML=`<p class="error">${e(err.message)}</p>`);
</script></body></html>
